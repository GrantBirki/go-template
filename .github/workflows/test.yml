name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: openai/fence@7703f3be10ee3d0a84e1839233e19fa00bb254a8 # pin@v0.13.2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: test
        run: script/test
